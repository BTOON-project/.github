name: Bug report
description: Something doesn't work as the docs or the spec say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use private reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Library and version
      description: For example "btoon 0.3.0 (PyPI)", "@btoon/js 0.3.0", "btoon-go v0.3.0".
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, and the runtime or compiler version (Python, Node.js, Go, PHP, C++ compiler).
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A minimal program or input. For input documents, the bytes as hex help most.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Include the full error message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
